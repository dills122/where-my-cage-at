name: OpenTofu Infrastructure Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/opentofu.action.yml'

permissions:
  contents: read

concurrency:
  group: opentofu-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -check -recursive

      - name: Initialize providers without a backend
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: tofu validate -no-color
