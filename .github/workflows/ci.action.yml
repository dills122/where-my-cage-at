name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rush
      - name: Confirm install leaves dependency manifests unchanged
        run: git diff --exit-code -- rush.json apps/*/package.json common/config/rush/pnpm-lock.yaml

  lint_and_format:
    name: Lint and formatting
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rush
      - name: ESLint
        run: node common/scripts/install-run-rush.js lint
      - name: Prettier on changed files
        run: node common/scripts/install-run-rush.js prettier-check

  build:
    name: Workspace build
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rush
      - name: Remove generated TypeScript output
        run: node common/scripts/install-run-rush.js clean
      - name: Build every workspace
        run: node common/scripts/install-run-rush.js build

  unit_and_contract_tests:
    name: Unit and contract tests
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rush
      - name: Frontend unit tests
        working-directory: apps/frontend
        run: node ../../common/scripts/install-run-rushx.js test --watch=false --browsers=ChromeHeadless
      - name: API unit tests
        working-directory: apps/api
        run: node ../../common/scripts/install-run-rushx.js test --runInBand
      - name: API e2e tests
        working-directory: apps/api
        run: node ../../common/scripts/install-run-rushx.js test:e2e --runInBand
      - name: Data-service ingestion tests
        working-directory: apps/data-service
        run: node ../../common/scripts/install-run-rushx.js test
      - name: Redis SDK unit tests
        working-directory: apps/redis-sdk
        run: node ../../common/scripts/install-run-rushx.js test
      - name: JustWatch fixture contract tests
        working-directory: apps/wtw
        run: node ../../common/scripts/install-run-rushx.js test

  integration_smoke:
    name: API, Redis, and browser smoke
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rush
      - name: Build API and workspace dependencies
        run: node common/scripts/install-run-rush.js build --to api
      - name: Exercise Redis SDK against an isolated instance
        working-directory: apps/redis-sdk
        run: node ../../common/scripts/install-run-rushx.js test:integration
      - name: Seed deterministic catalogues
        run: |
          docker exec -i "${{ job.services.redis.id }}" redis-cli -x JSON.SET moviecatalog:jsondata '$' < .github/fixtures/movie-catalog.json
          docker exec -i "${{ job.services.redis.id }}" redis-cli -x JSON.SET serviceproviders:jsondata '$' < .github/fixtures/service-providers.json
      - name: Start isolated API and frontend
        run: |
          NODE_ENV=dev REDIS_HOST=127.0.0.1 REDIS_PORT=6379 API_PORT=3000 node apps/api/dist/main.js > api-smoke.log 2>&1 &
          echo $! > api-smoke.pid
          (cd apps/frontend && node ../../common/scripts/install-run-rushx.js start --host 127.0.0.1 --port 4200) > frontend-smoke.log 2>&1 &
          echo $! > frontend-smoke.pid
      - name: Wait for the isolated stack
        run: |
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/filmography > /dev/null
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:4200/ > /dev/null
      - name: Verify API reads the seeded Redis catalogues
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/filmography | jq --exit-status 'length == 1 and .[0].title == "Longlegs"'
          curl --fail --silent --show-error http://127.0.0.1:3000/service-providers | jq --exit-status 'length == 3'
      - name: Cypress browser smoke
        working-directory: apps/frontend
        run: node ../../common/scripts/install-run-rushx.js cypress:run
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          if-no-files-found: ignore
          path: |
            api-smoke.log
            frontend-smoke.log
            apps/frontend/cypress/screenshots
            apps/frontend/cypress/videos
      - name: Stop local smoke processes
        if: always()
        run: |
          if [ -f api-smoke.pid ]; then kill "$(cat api-smoke.pid)" 2>/dev/null || true; fi
          if [ -f frontend-smoke.pid ]; then kill "$(cat frontend-smoke.pid)" 2>/dev/null || true; fi

  docker_images:
    name: Production image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [api, data-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: where-my-cage-at/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  automerge:
    needs:
      - dependencies
      - lint_and_format
      - build
      - unit_and_contract_tests
      - integration_smoke
      - docker_images
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
