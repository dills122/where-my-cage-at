name: Refresh and deploy Cloudflare

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      deployment_sha:
        description: Full merged commit SHA to build and deploy
        required: true
        type: string
      run_hosted_smoke:
        description: Verify the production site after deployment
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build a fresh catalogue and deploy production
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - name: Checkout immutable release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_sha || 'master' }}

      - name: Verify immutable release ancestry
        id: release
        env:
          DEPLOYMENT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ ! "$DEPLOYMENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::deployment_sha must be a full lowercase commit ID."
              exit 1
            fi
            if [[ "$checked_out_sha" != "$DEPLOYMENT_SHA" ]]; then
              echo "::error::Checkout did not resolve the selected immutable deployment SHA."
              exit 1
            fi
          fi

          git merge-base --is-ancestor HEAD origin/master
          echo "deployment_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.1

      - name: Install frozen workspace dependencies
        run: node common/scripts/install-run-rush.js install

      - name: Verify deployment configuration
        run: node --test scripts/deployment-config.test.mjs

      - name: Generate a fresh static catalogue
        working-directory: apps/data-service
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node ../../common/scripts/install-run-rushx.js refresh:static ../frontend/src/assets/catalogue

      - name: Build Angular static assets
        working-directory: apps/frontend
        run: node ../../common/scripts/install-run-rushx.js build

      - name: Validate the Cloudflare bundle
        working-directory: apps/frontend
        run: node ../../common/scripts/install-run-rushx.js cloudflare:dry-run

      - name: Deploy the reviewed Cloudflare bundle
        working-directory: apps/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ../../common/scripts/install-run-rushx.js cloudflare:deploy

      - name: Record the deployed version and catalogue
        working-directory: apps/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_SHA: ${{ steps.release.outputs.deployment_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler deployments list --config wrangler.jsonc --json > "$RUNNER_TEMP/deployments.json"
          catalogue_version="$(jq -r '.catalogueVersion' src/assets/catalogue/catalogue-manifest.json)"
          generated_at="$(jq -r '.generatedAt' src/assets/catalogue/catalogue-manifest.json)"
          {
            echo "## Cloudflare deployment"
            echo ""
            echo "- Commit: \`$DEPLOYMENT_SHA\`"
            echo "- Catalogue: \`$catalogue_version\`"
            echo "- Generated: \`$generated_at\`"
            echo "- Latest deployment: \`$(jq -c 'if type == "array" then .[0] else . end' "$RUNNER_TEMP/deployments.json")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the hosted site
        if: github.event_name == 'schedule' || inputs.run_hosted_smoke
        env:
          PRODUCTION_ORIGIN: ${{ vars.WMCA_PRODUCTION_ORIGIN || 'https://wheremycageat.com' }}
        shell: bash
        run: |
          set -euo pipefail
          origin="${PRODUCTION_ORIGIN%/}"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 "$origin/" > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 \
            "$origin/assets/catalogue/catalogue-manifest.json" \
            | jq --exit-status '.schemaVersion == 1 and (.artifacts | length == 2)' > /dev/null
