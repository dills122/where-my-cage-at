<div class="app-shell">
	<header class="site-header">
		<a class="site-brand" routerLink="/" aria-label="Where My Cage At home">
			<i class="pi pi-home" aria-hidden="true"></i>
			<span>Where My Cage At?</span>
		</a>

		<nav class="site-nav" aria-label="Primary navigation">
			<a
				class="site-nav__link"
				routerLink="/"
				routerLinkActive="is-active"
				[routerLinkActiveOptions]="{ exact: true }"
			>
				Home
			</a>
			<a class="site-nav__link" routerLink="/available-service-providers" routerLinkActive="is-active"
				>Services</a
			>
			<button class="site-nav__link" type="button" disabled title="Coming soon">Staff Picks</button>
			<button class="site-nav__link" type="button" disabled title="Coming soon">Data View</button>
		</nav>

		<div class="theme-control">
			<span class="visually-hidden">Color theme</span>
			<p-toggleButton
				onLabel="Light"
				offLabel="Dark"
				onIcon="pi pi-moon"
				offIcon="pi pi-sun"
				iconPos="right"
				[(ngModel)]="isDarkTheme"
				(onChange)="handleChange($event)"
			></p-toggleButton>
		</div>
	</header>

	<main class="app-main">
		<router-outlet></router-outlet>
	</main>
</div>
