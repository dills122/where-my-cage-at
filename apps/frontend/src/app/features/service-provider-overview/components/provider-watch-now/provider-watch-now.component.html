<div class="flex flex-wrap">
	@for (offer of offersForProvider; track offer) {
		<div class="flex align-items-center justify-content-center p-1">
			<p-chip
				[label]="createLabelName(offer.monetizationType, offer.presentationType)"
				class="watch-action-node text-xs"
				(click)="openExternalLink(offer.urls)"
			></p-chip>
		</div>
	}
</div>
