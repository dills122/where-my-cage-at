@if (checkForProvidersWithDesiredMonitizationModel(this.monitizationType)) {
	<div class="py-1">
		<h2>{{ title }}:</h2>
		<p-card>
			<div class="flex justify-content-around flex-wrap">
				@for (
					serviceProvider of getViewingOptionsBasedOnViewingPreference(this.monitizationType) | async;
					track serviceProvider
				) {
					<app-service-icon
						[serviceId]="serviceProvider.id"
						[serviceName]="serviceProvider.clearName"
						[providerIconUrl]="serviceProvider.iconUrl"
						[externalUrl]="getFirstUrlForServiceProvider(serviceProvider.id, this.monitizationType)"
					>
					</app-service-icon>
				}
			</div>
		</p-card>
	</div>
}
