@if (filmRecord$ | async; as film) {
	<main class="film-detail" aria-labelledby="film-title">
		<header class="film-detail__intro">
			<div class="film-detail__copy">
				<h1 id="film-title">{{ film.title }}</h1>
				<p>{{ film.shortDescription }}</p>
			</div>

			<div class="film-detail__context">
				<dl>
					<div>
						<dt>Released</dt>
						<dd>{{ film.originalReleaseYear }}</dd>
					</div>
					<div>
						<dt>Runtime</dt>
						<dd>{{ film.runtime }}&nbsp;min</dd>
					</div>
				</dl>

				<ul aria-label="Genres">
					@for (genre of film.genres; track genre) {
						<li>{{ genre }}</li>
					}
				</ul>
			</div>
		</header>

		<section class="film-detail__viewing" aria-labelledby="viewing-options-title">
			<h2 id="viewing-options-title">Viewing options</h2>

			<div class="film-detail__groups">
				<app-available-providers-by-monitization-type
					[offers]="film.offers"
					[monitizationType]="MonetizationTypes.BUY"
				></app-available-providers-by-monitization-type>
				<app-available-providers-by-monitization-type
					[offers]="film.offers"
					[monitizationType]="MonetizationTypes.ADS"
				></app-available-providers-by-monitization-type>
				<app-available-providers-by-monitization-type
					[offers]="film.offers"
					[monitizationType]="MonetizationTypes.FREE"
				></app-available-providers-by-monitization-type>
				<app-available-providers-by-monitization-type
					[offers]="film.offers"
					[monitizationType]="MonetizationTypes.RENT"
				></app-available-providers-by-monitization-type>
				<app-available-providers-by-monitization-type
					[offers]="film.offers"
					[monitizationType]="MonetizationTypes.SUBSCRIPTION"
				></app-available-providers-by-monitization-type>
			</div>
		</section>
	</main>
} @else {
	<p class="film-detail__status" aria-live="polite">Loading film details…</p>
}
