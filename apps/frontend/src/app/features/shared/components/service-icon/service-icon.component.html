<div class="flex flex-column text-center" (click)="openUrl()">
	<div class="flex align-items-center justify-content-center m-3">
		<img
			[src]="imageUrl"
			(error)="useProviderFallback($event)"
			[attr.alt]="serviceName ? serviceName + ' icon' : 'Streaming service icon'"
			class="border-circle"
		/>
	</div>
	<div class="flex align-items-center justify-content-center font-bold">
		<div style="inline-size: 100px; overflow-wrap: break-word">
			{{ serviceName }}
		</div>
	</div>
</div>
