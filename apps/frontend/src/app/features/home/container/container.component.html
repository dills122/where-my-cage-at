<div class="home-page">
	<section class="hero" aria-labelledby="home-title">
		<h1 id="home-title" class="hero__title">This movie night, make it a Nick-casion.</h1>
		<div class="hero__search">
			<app-film-search></app-film-search>
		</div>
	</section>

	<section class="providers" aria-labelledby="providers-title">
		<div class="providers__inner">
			<h2 id="providers-title" class="providers__title">{{ cardHeader }}</h2>
			<div class="providers__grid">
				<app-service-button-node
					*ngFor="let service of highlightedServices"
					[serviceName]="service.serviceName"
					[serviceIcon]="service.serviceIcon"
					[serviceId]="service.serviceId"
				></app-service-button-node>
			</div>
		</div>
	</section>

	<footer class="cage-marquee" aria-label="Nicolas Cage movie night" tabindex="0">
		<div class="cage-marquee__track" aria-hidden="true">
			<span>Nicolas Cage · Movie night · No bad options ·</span>
			<span>Nicolas Cage · Movie night · No bad options ·</span>
		</div>
		<p class="visually-hidden">Nicolas Cage movie night. No bad options.</p>
	</footer>
</div>
