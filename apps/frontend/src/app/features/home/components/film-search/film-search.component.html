<div class="film-search">
	<label class="film-search__label" for="film-title-search">Search your favorite title</label>
	<p id="film-search-help" class="film-search__help">Type a title, then pick a movie from the list.</p>
	<p-autoComplete
		inputId="film-title-search"
		[(ngModel)]="text"
		[suggestions]="results"
		(completeMethod)="search($event)"
		(onSelect)="navigate($event)"
		optionLabel="title"
		[minLength]="1"
		[forceSelection]="true"
		placeholder="Try “Moonstruck”"
		aria-describedby="film-search-help"
	></p-autoComplete>
</div>
