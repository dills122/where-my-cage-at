services:
  redis-base:
    image: redis/redis-stack-server:7.4.0-v8
    hostname: redis-redisjson
    ports:
      - '${REDIS_PORT:-6379}:6379'
    environment:
      REDIS_ARGS: '--save 60 1 --appendonly yes'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped
